name: CI

on:
  push:
    branches: [main]
  pull_request:

# This workflow runs on pull_request, including from forks, so it must
# NEVER request id-token/AWS credentials or become pull_request_target.
# Tests run entirely against moto's mocked EC2 (see tests/) - no real
# AWS access is needed or granted here.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy src

      - name: Test
        run: pytest -v

name: Reap Expired VMs

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

# schedule always runs the workflow file from the default branch, and
# manual dispatch is scoped to main by the IAM trust policy (see
# infra/iam-trust-policy.json). Do not add pull_request/pull_request_target
# triggers to this file.
permissions:
  id-token: write
  contents: read

jobs:
  reap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e .

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Reap expired instances
        run: evp reap --json

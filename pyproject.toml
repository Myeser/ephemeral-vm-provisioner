[project]
name = "ephemeral-vm-provisioner"
version = "0.1.0"
description = "Self-service, TTL-bound EC2 instances requested and reaped via GitHub Actions."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "boto3>=1.34",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "moto[ec2]>=5.0",
    "mypy>=1.9",
    "ruff>=0.4",
    "boto3-stubs[ec2]>=1.34",
]

[project.scripts]
evp = "evp.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
